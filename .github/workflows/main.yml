name: Build NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            gcc-9-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi \
            make bc bison flex \
            libssl-dev libelf-dev \
            build-essential python3 zip

      - name: Set GCC 9 as cross compiler
        run: |
          sudo update-alternatives --install \
            /usr/bin/arm-linux-gnueabi-gcc \
            arm-linux-gnueabi-gcc \
            /usr/bin/arm-linux-gnueabi-gcc-9 1
          arm-linux-gnueabi-gcc --version

      - name: Patch DTC yylloc
        run: |
          sed -i 's/YYLTYPE yylloc/extern YYLTYPE yylloc/' \
            scripts/dtc/dtc-lexer.lex.c_shipped

      - name: Patch proc-v7.S for modern GAS
        run: |
          # Modern GAS rejects # as comment character in ARM ISA lines
          # Replace lines where # is used as immediate prefix with @
          sed -i 's/@ #\([0-9]\)/@ $\1/g' arch/arm/mm/proc-v7.S
          sed -i 's/,\s*#\([0-9]\)/,#\1/g' arch/arm/mm/proc-v7.S
          # Show line 463-467 so we can verify
          sed -n '463,467p' arch/arm/mm/proc-v7.S

      - name: Patch syscalls.h for modern GCC
        run: |
          # The .err assembler directive in fork.o is triggered by
          # __SYSCALL_DEFINEx type checking — disable the error trigger
          sed -i 's/\bassmlinkage\b/asmlinkage/g' include/linux/syscalls.h || true
          # Disable -Werror=attribute-alias which causes .err in asm output
          sed -i 's/-Werror=attribute-alias=2//' Makefile || true
          sed -i 's/-Werror=attribute-alias//' Makefile || true
          # Also patch it in arch/arm/Makefile
          sed -i 's/-Werror=attribute-alias=2//' arch/arm/Makefile || true
          sed -i 's/-Werror=attribute-alias//' arch/arm/Makefile || true

      - name: Patch kernel fork.c .err trigger
        run: |
          # The .err comes from this check in syscalls.h when compiled
          # with newer GCC — patch it to use __attribute__((alias)) without error
          sed -i '/__attribute__((error/d' include/linux/syscalls.h || true
          sed -i '/BUILD_BUG_ON_MSG/d' include/linux/syscalls.h || true
          # Suppress the specific warning that generates .err in asm
          echo "KBUILD_CFLAGS += -Wno-attribute-alias" >> arch/arm/Makefile

      - name: Build Kernel
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabi-
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- potter_defconfig
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- \
            KCFLAGS="-Wno-attribute-alias -Wno-error" \
            -j$(nproc)

      - name: Check Boot Output
        run: ls arch/arm/boot/

      - name: Package Kernel
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          # Try zImage first, fall back to zImage-dtb or Image.gz-dtb
          if [ -f arch/arm/boot/zImage ]; then
            cp arch/arm/boot/zImage ak3/
          elif [ -f arch/arm/boot/zImage-dtb ]; then
            cp arch/arm/boot/zImage-dtb ak3/zImage
          elif [ -f arch/arm/boot/Image.gz-dtb ]; then
            cp arch/arm/boot/Image.gz-dtb ak3/
          else
            echo "ERROR: No kernel image found!"
            ls arch/arm/boot/
            exit 1
          fi
          cd ak3
          zip -r9 ../NetHunter-Potter.zip * -x .git README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Potter-Kernel
          path: NetHunter-Potter.zip