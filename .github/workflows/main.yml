name: Build NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            gcc-9-arm-linux-gnueabi \
            make bc bison flex \
            libssl-dev libelf-dev \
            build-essential python3 zip

      - name: Patch DTC yylloc
        run: |
          sed -i 's/YYLTYPE yylloc/extern YYLTYPE yylloc/' \
            scripts/dtc/dtc-lexer.lex.c_shipped

      - name: Build Kernel
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabi-9-
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi-9- potter_defconfig
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi-9- -j$(nproc)

      - name: Check Boot Output
        run: ls arch/arm/boot/

      - name: Package Kernel
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          cp arch/arm/boot/zImage ak3/
          cd ak3
          zip -r9 ../NetHunter-Potter.zip * -x .git README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Potter-Kernel
          path: NetHunter-Potter.zip