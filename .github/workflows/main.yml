name: Build NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-9-arm-linux-gnueabi binutils-arm-linux-gnueabi make bc bison flex libssl-dev libelf-dev build-essential python3 zip

      - name: Set GCC 9 as cross compiler
        run: |
          sudo update-alternatives --install /usr/bin/arm-linux-gnueabi-gcc arm-linux-gnueabi-gcc /usr/bin/arm-linux-gnueabi-gcc-9 1
          arm-linux-gnueabi-gcc --version

      - name: Patch DTC yylloc
        run: |
          sed -i 's/YYLTYPE yylloc/extern YYLTYPE yylloc/' scripts/dtc/dtc-lexer.lex.c_shipped

      - name: Patch syscalls.h
        run: |
          python3 -c "f=open('include/linux/syscalls.h','r');c=f.read();f.close();c=c.replace('__attribute__((alias(__stringify(SyS##name))))','');f=open('include/linux/syscalls.h','w');f.write(c);f.close();print('patched')"

      - name: Suppress warnings
        run: |
          echo "KBUILD_CFLAGS += -Wno-attribute-alias" >> arch/arm/Makefile

      - name: Build Kernel
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabi-
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- potter_defconfig
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- KCFLAGS="-Wno-attribute-alias -Wno-error -w" -j$(nproc)

      - name: Check Boot Output
        run: ls -la arch/arm/boot/

      - name: Package Kernel
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          if [ -f arch/arm/boot/zImage ]; then
            cp arch/arm/boot/zImage ak3/
          elif [ -f arch/arm/boot/zImage-dtb ]; then
            cp arch/arm/boot/zImage-dtb ak3/zImage
          elif [ -f arch/arm/boot/Image.gz-dtb ]; then
            cp arch/arm/boot/Image.gz-dtb ak3/
          else
            ls arch/arm/boot/ && exit 1
          fi
          cd ak3 && zip -r9 ../NetHunter-Potter.zip * -x .git README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Potter-Kernel
          path: NetHunter-Potter.zip